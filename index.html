/* Layout: one file, two faces. Guests get an envelope that opens onto full-screen pages; the owner gets an editor with tabs (side list on desktop, scroll strip on phones). */
:root {

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --e-bg: #161112; --e-surface: #211a1c; --e-field: #2a2124; --e-fg: #f3e9ea; --e-muted: #b3a2a6;
    --e-line: #3a2f32; --e-accent: #e5849f; --e-accent-fg: #2a0b15; --e-ok: #7fd1a3; --e-bad: #ff9a92; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --e-bg: #161112; --e-surface: #211a1c; --e-field: #2a2124; --e-fg: #f3e9ea; --e-muted: #b3a2a6;
  --e-line: #3a2f32; --e-accent: #e5849f; --e-accent-fg: #2a0b15; --e-ok: #7fd1a3; --e-bad: #ff9a92; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; }
.splash { min-height: 100vh; display: grid; place-items: center; font-family: var(--script); color: #8a747a; font-style: italic; }
body.m-boot { background: #f3eae6; }

/* ================= editor ================= */

.e-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--e-bg); border-bottom: 1px solid var(--e-line); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 0; }

.e-btn { cursor: pointer; border: 1px solid var(--e-line); background: var(--e-field); color: var(--e-fg); border-radius: 8px; padding: 8px 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; }

.e-body { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; margin-top: 16px; align-items: start; }

.e-f input[type="text"], .e-f input[type="date"], .e-f input[type="time"], .e-f input[type="tel"], .e-f input[type="url"], .e-f input[type="number"], .e-f input[type="password"], .e-f textarea, .e-f select {
  width: 100%; font: inherit; font-size: 16px; color: var(--e-fg); background: var(--e-field); border: 1px solid var(--e-line); border-radius: 8px; padding: 9px 11px; min-width: 0; }
.e-f textarea { resize: vertical; min-height: 78px; line-height: 1.5; }

.e-seg { display: flex; flex-wrap: wrap; gap: 8px; }

.e-sw { width: 38px; height: 24px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .25); display: inline-block; }
.e-chk { display: flex; gap: 10px; align-items: center; padding: 6px 0; }

.e-item { border: 1px solid var(--e-line); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--e-bg); }

.e-item .e-f:last-child { margin-bottom: 0; }
.e-ic { border: 1px solid var(--e-line); background: var(--e-field); color: var(--e-fg); border-radius: 6px; width: 34px; height: 32px; cursor: pointer; font-size: 1rem; }
.e-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
.e-ph { border: 1px solid var(--e-line); border-radius: 8px; overflow: hidden; background: var(--e-bg); display: flex; flex-direction: column; }
.e-ph img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
.e-ph div { display: flex; justify-content: center; gap: 4px; padding: 6px; }
.e-note { border-left: 3px solid var(--e-accent); background: var(--e-surface); padding: 10px 14px; margin-bottom: 14px; border-radius: 0 8px 8px 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.e-note span { flex: 1 1 240px; min-width: 0; }
.e-steps { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
.e-steps code { font-family: ui-monospace, monospace; font-size: .88rem; background: var(--e-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.e-guest { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--e-line); }

.e-guest .e-g-act { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.e-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: #241a1c; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 200; max-width: min(92vw, 420px); font: 600 .95rem/1.4 var(--ui); text-align: center; }
audio { width: 100%; margin-top: 8px; }
@media (max-width: 820px) {
  .e-body { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .e-nav { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .e-nav button { white-space: nowrap; border: 1px solid var(--e-line); }
}
@media (max-width: 520px) { .e-row, .e-guest { grid-template-columns: minmax(0, 1fr); } .e-row { gap: 0; } }

/* ================= invitation (guest view) ================= */

  padding-block: 64px 96px; padding-left: max(58px, env(safe-area-inset-left, 0px), calc((100% - var(--colw)) / 2 + 58px)); padding-right: max(58px, env(safe-area-inset-right, 0px), calc((100% - var(--colw)) / 2 + 58px)); }

.tl .it .a .ic { margin-left: auto; } .tl .it.flip .a .ic { margin-left: 0; }
.sw { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 4px; }

.btn { font-family: var(--ui); font-weight: 700; font-size: 1rem; background: var(--wine); color: var(--wine-fg); border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; text-align: center; }

#vw input:focus-visible, #vw textarea:focus-visible, #vw .btn:focus-visible, #vw summary:focus-visible, #vw .dir:focus-visible, .mus:focus-visible, .back:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }
#env { position: fixed; inset: 0; z-index: 100; cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }

@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.tag { position: fixed; left: max(8px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 120; font: 600 12px system-ui, sans-serif; background: var(--wine); color: var(--wine-fg); padding: 3px 9px; border-radius: 3px; }
