/* Layout: one file, two faces. Guests get an envelope that opens onto full-screen pages; the owner gets an editor with tabs (side list on desktop, scroll strip on phones). */
:root {
  --e-bg: #f5f2f1; --e-surface: #fffdfc; --e-field: #ffffff; --e-fg: #241a1c; --e-muted: #6d5e61;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --e-bg: #161112; --e-surface: #211a1c; --e-field: #2a2124; --e-fg: #f3e9ea; --e-muted: #b3a2a6;
    --e-line: #3a2f32; --e-accent: #e5849f; --e-accent-fg: #2a0b15; --e-ok: #7fd1a3; --e-bad: #ff9a92; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --e-bg: #161112; --e-surface: #211a1c; --e-field: #2a2124; --e-fg: #f3e9ea; --e-muted: #b3a2a6;
  --e-line: #3a2f32; --e-accent: #e5849f; --e-accent-fg: #2a0b15; --e-ok: #7fd1a3; --e-bad: #ff9a92; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; }
.splash { min-height: 100vh; display: grid; place-items: center; font-family: var(--script); color: #8a747a; font-style: italic; }
body.m-boot { background: #f3eae6; }

/* ================= editor ================= */

.e-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--e-bg); border-bottom: 1px solid var(--e-line); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 0; }

.e-btn { cursor: pointer; border: 1px solid var(--e-line); background: var(--e-field); color: var(--e-fg); border-radius: 8px; padding: 8px 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; }

.e-f input[type="text"], .e-f input[type="date"], .e-f input[type="time"], .e-f input[type="tel"], .e-f input[type="url"], .e-f input[type="number"], .e-f input[type="password"], .e-f textarea, .e-f select {
  width: 100%; font: inherit; font-size: 16px; color: var(--e-fg); background: var(--e-field); border: 1px solid var(--e-line); border-radius: 8px; padding: 9px 11px; min-width: 0; }
.e-f textarea { resize: vertical; min-height: 78px; line-height: 1.5; }

.e-sw { width: 38px; height: 24px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .25); display: inline-block; }
.e-chk { display: flex; gap: 10px; align-items: center; padding: 6px 0; }

.e-item { border: 1px solid var(--e-line); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--e-bg); }

.e-item .e-f:last-child { margin-bottom: 0; }
.e-ic { border: 1px solid var(--e-line); background: var(--e-field); color: var(--e-fg); border-radius: 6px; width: 34px; height: 32px; cursor: pointer; font-size: 1rem; }
.e-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
.e-ph { border: 1px solid var(--e-line); border-radius: 8px; overflow: hidden; background: var(--e-bg); display: flex; flex-direction: column; }
.e-ph img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
.e-ph div { display: flex; justify-content: center; gap: 4px; padding: 6px; }
.e-note { border-left: 3px solid var(--e-accent); background: var(--e-surface); padding: 10px 14px; margin-bottom: 14px; border-radius: 0 8px 8px 0; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.e-note span { flex: 1 1 240px; min-width: 0; }
.e-steps { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
.e-steps code { font-family: ui-monospace, monospace; font-size: .88rem; background: var(--e-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.e-guest { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--e-line); }
.e-guest .e-f { margin-bottom: 0; }

.e-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: #241a1c; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 200; max-width: min(92vw, 420px); font: 600 .95rem/1.4 var(--ui); text-align: center; }

@media (max-width: 820px) {

  .e-nav button { white-space: nowrap; border: 1px solid var(--e-line); }
}
@media (max-width: 520px) { .e-row, .e-guest { grid-template-columns: minmax(0, 1fr); } .e-row { gap: 0; } }

/* ================= invitation (guest view) ================= */
html.vmode { scroll-snap-type: y proximity; scroll-behavior: smooth; }

.tl .nm { font-family: var(--ui); font-weight: 700; font-size: .85rem; color: var(--blue); overflow-wrap: anywhere; }

.tl .ic { width: 34px; height: 34px; margin-bottom: 2px; }
.tl .it .a .ic { margin-left: auto; } .tl .it.flip .a .ic { margin-left: 0; }
.sw { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 4px; }

.rsvp input[type="text"], .rsvp input[type="number"], .rsvp textarea { width: 100%; font-family: var(--ui); font-size: 16px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }

.opts { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--ui); font-size: .95rem; }

.btn { font-family: var(--ui); font-weight: 700; font-size: 1rem; background: var(--wine); color: var(--wine-fg); border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; text-align: center; }

.done textarea { width: 100%; font: 15px/1.5 var(--ui); min-height: 110px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--field); color: var(--ink); }
#vw input:focus-visible, #vw textarea:focus-visible, #vw .btn:focus-visible, #vw summary:focus-visible, #vw .dir:focus-visible, .mus:focus-visible, .back:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }
#env { position: fixed; inset: 0; z-index: 100; cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }

#env .top { position: absolute; top: calc(7% + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center; padding-inline: max(24px, env(safe-area-inset-left, 0px)); transition: opacity .4s, transform .8s; color: var(--wine); }

@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
#env.open .ft { transform: translateY(-102%); } #env.open .fb { transform: translateY(102%); }
#env.open .fle { transform: translateX(-102%); } #env.open .fr { transform: translateX(102%); }

.go .rise > * { animation: rise .9s both ease-out; }

.tag { position: fixed; left: max(8px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 120; font: 600 12px system-ui, sans-serif; background: var(--wine); color: var(--wine-fg); padding: 3px 9px; border-radius: 3px; }

    if (t.dataset.gh) { var s = ghStore(); s[t.dataset.gh] = t.value.trim(); ls.set('mn-gh', JSON.stringify(s)); return; }
    if (t.dataset.gp) { var P = phones(); P[t.dataset.gp] = t.value.trim(); savePhones(P); refreshLinks(); return; }
    if (t.dataset.l) {
      var arr = get(S, t.dataset.l), it = arr && arr[+t.dataset.i]; if (!it) return;
      it[t.dataset.f] = t.value; markDirty(); if (t.dataset.l === 'guests') refreshLinks(); return;
    }
    if (t.dataset.k) {
      var k = t.dataset.k, v;
      if (t.type === 'checkbox') v = t.checked; else if (t.type === 'radio') { if (!t.checked) return; v = t.value; } else if (t.type === 'number') v = Number(t.value) || 0; else v = t.value;
      if (k === 'type') {
        var old = S.type; set(S, k, v);
        if (S.headline === HEAD[old]) S.headline = HEAD[v]; if (S.envLine === ENVL[old]) S.envLine = ENVL[v];
        markDirty(); renderTab(); return;
      }
      if (k === 'music.src') { S.music.name = ''; S.music.size = 0; }
      set(S, k, v); markDirty(); if (k === 'shareUrl') refreshLinks();
    }
  }
  root.addEventListener('click', function (e) {
    if (mode !== 'edit') return;
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, l = b.dataset.l, i = +b.dataset.i;
    if (act === 'tab') { tab = b.dataset.t; renderTab(); window.scrollTo(0, 0); }
    else if (act === 'preview') enterView(true);
    else if (act === 'publish') doPublish();
    else if (act === 'add') {
      var arr = get(S, l), nw = { events: { time: '', t: '', d: '', icon: 'flower' }, 'dress.colors': { n: '', c: '#c9a24a' }, faq: { q: '', a: '' } }[l];
      arr.push(nw); markDirty(); renderTab();
    } else if (act === 'del' || act === 'up' || act === 'down') {
      var a = get(S, l), j = act === 'up' ? i - 1 : act === 'down' ? i + 1 : i;
      if (act === 'del') a.splice(i, 1); else if (j >= 0 && j < a.length) { var tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
      markDirty(); renderTab();
    } else if (act === 'clear') {
      ['groom', 'bride', 'gpar', 'bpar', 'date', 'time', 'venue', 'addr', 'map', 'host', 'hostPhone', 'message'].forEach(function (k) { S[k] = ''; });
      S.events = []; S.faq = []; S.photos = []; S.guests = []; S.dress = { women: '', men: '', colors: [] }; S.sample = false;
      markDirty(); renderNotes(); renderTab();
    } else if (act === 'draftyes') { try { S = Object.assign(clone(DEF), JSON.parse(ls.get('mn-draft'))); } catch (x) {} draftNote = ''; dirty = true; renderNotes(); renderTab(); setStatus('मसुदा परत आणला'); }
    else if (act === 'draftno') { ls.del('mn-draft'); draftNote = ''; renderNotes(); }
    else if (act === 'rmsong') { S.music.src = ''; S.music.name = ''; S.music.size = 0; markDirty(); renderTab(); }
    else if (act === 'addguests') {
      var box = $('g-bulk'), lines = box.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean), P = phones();
      lines.forEach(function (ln) { var p = ln.split(/[,\t]/), nm = p.shift().trim(); if (!nm) return; var id = 'g' + Math.random().toString(36).slice(2, 7); S.guests.push({ id: id, name: nm }); var ph = p.join('').trim(); if (ph) P[id] = ph; });
      savePhones(P); box.value = ''; markDirty(); renderTab();
    } else if (act === 'copylink') {
      var g = S.guests.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!g) return;
      var lk = guestLink(g); if (!lk) { toast('आधी निमंत्रणाची मुख्य लिंक भरा'); return; } copyText(lk, b);
    } else if (act === 'export') exportFile();
  });
  root.addEventListener('click', function (e) { var a = e.target.closest('a[data-wa]'); if (a && a.getAttribute('aria-disabled') === 'true') { e.preventDefault(); toast('आधी निमंत्रणाची मुख्य लिंक भरा'); } });

  /* ---- photos & song ---- */
  function shrink(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var M = 900, k = Math.min(1, M / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = function () { URL.revokeObjectURL(url); rej(); }; im.src = url;
    });
  }
  function addPhotos(files) {
    var list = Array.prototype.slice.call(files || []).slice(0, Math.max(0, 12 - S.photos.length));
    if (!list.length) { toast('जास्तीत जास्त १२ फोटो'); return; }
    setStatus('फोटो तयार होत आहेत…');
    Promise.all(list.map(function (f) { return shrink(f).catch(function () { return null; }); })).then(function (r) {
      r.forEach(function (u) { if (u) S.photos.push(u); }); markDirty(); renderTab();
    });
  }
  function addSong(file) {
    if (!file) return;
    if (file.type && file.type.indexOf('audio') !== 0) { toast('कृपया गाण्याची (audio) फाइल निवडा'); return; }
    if (CLAUDE && file.size > 6 * 1024 * 1024) { toast('फाइल मोठी आहे. ४ MB पेक्षा लहान क्लिप निवडा.'); return; }
    var fr = new FileReader(); setStatus('गाणे जोडत आहे…');
    fr.onload = function () { S.music.src = fr.result; S.music.name = file.name; S.music.size = file.size; markDirty(); renderTab(); };
    fr.onerror = function () { toast('गाणे वाचता आले नाही'); };
    fr.readAsDataURL(file);
  }

  /* ---- build + save ---- */
  function buildDoc(web) {
    var names = esc((S.groom || '') + ' आणि ' + (S.bride || ''));
    var data = JSON.stringify(S).replace(/</g, '\\u003c');
    var css = $('css').textContent, app = $('app').textContent;
    var fl = '<link rel="stylesheet" href="' + FONTS + '">';
    var tail = '<div id="root"></div><script type="application/json" id="inv-data">' + data + END + '<script id="app">' + app + END;
    if (web) {
      var og = '<meta property="og:title" content="' + names + '"><meta property="og:description" content="' + (S.type === 'engagement' ? 'साखरपुड्याचे निमंत्रण' : 'विवाह निमंत्रण') + '. उघडण्यासाठी टॅप करा."><meta property="og:type" content="website">';
      return '<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>' + names + '</title>' + og + fl + '<style id="css">' + css + '</style></head><body>' + tail + '</body></html>';
    }
    return SKEL + '\n<title>' + names + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' + fl + '\n<style id="css">' + css + '</style>\n' + tail + '\n</body></html>';
  }
  function b64s(str) { var b = new TextEncoder().encode(str), s = '', n = 0x8000; for (var i = 0; i < b.length; i += n) s += String.fromCharCode.apply(null, b.subarray(i, i + n)); return btoa(s); }
  function ghErr(r, j) { var e = new Error((j && j.message) || ('HTTP ' + r.status)); e.code = r.status; return e; }
  async function ghPut(path, b64, msg) {
    var c = ghCfg(); if (!c.token || !c.owner || !c.repo) { var e0 = new Error('setup'); e0.code = 'gh_setup'; throw e0; }
    var H = { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    var base = 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo), br = c.branch;
    if (!br) { var r0 = await fetch(base, { headers: H }); if (!r0.ok) throw ghErr(r0, await r0.json().catch(function () { return {}; })); br = (await r0.json()).default_branch || 'main'; }
    var url = base + '/contents/' + path.split('/').map(encodeURIComponent).join('/'), body = { message: msg, content: b64, branch: br };
    var g = await fetch(url + '?ref=' + encodeURIComponent(br), { headers: H });
    if (g.status === 200) body.sha = (await g.json()).sha; else if (g.status !== 404) throw ghErr(g, await g.json().catch(function () { return {}; }));
    var p = await fetch(url, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, H), body: JSON.stringify(body) });
    if (!p.ok) throw ghErr(p, await p.json().catch(function () { return {}; }));
  }
  async function hostSong() {
    var m = S.music; if (!m || !m.src || m.src.indexOf('data:') !== 0 || (m.size && m.size < 700000)) return;
    var mm = /^data:([^;]+);base64,(.*)$/.exec(m.src); if (!mm) return;
    var ext = ({ 'audio/mpeg': 'mp3', 'audio/mp3': 'mp3', 'audio/mp4': 'm4a', 'audio/x-m4a': 'm4a', 'audio/aac': 'aac', 'audio/ogg': 'ogg', 'audio/wav': 'wav', 'audio/x-wav': 'wav' })[mm[1]] || 'mp3';
    var name = 'music.' + ext; await ghPut(name, mm[2], 'गाणे अद्ययावत'); m.src = name + '?v=' + Date.now().toString(36);
  }
  function validate() {
    if (!(S.groom || '').trim() || !(S.bride || '').trim()) { tab = 'basics'; renderTab(); return 'आधी वर आणि वधूची नावे भरा.'; }
    return '';
  }
  function showErr(e) {
    var c = e && e.code, m = 'जतन झाले नाही. पुन्हा प्रयत्न करा.';
    if (c === 'conflict') m = 'दुसऱ्या ठिकाणी बदल झाला होता. पान पुन्हा लोड होत आहे.';
    else if (c === 'not_writer' || c === 'not_granted' || c === 'not_declared') m = 'या पानात बदल जतन करण्याची परवानगी नाही.';
    else if (c === 'too_large') m = 'पान खूप मोठे झाले आहे. फोटो किंवा गाणे कमी करा.';
    else if (c === 'rate_limited') m = 'थोडा वेळ थांबून पुन्हा प्रयत्न करा.';
    else if (c === 'gh_setup') { m = 'आधी GitHub ची सेटिंग भरा (पाठवा विभाग).'; tab = 'share'; renderTab(); }
    else if (c === 401) m = 'GitHub token चुकीचा किंवा कालबाह्य आहे.';
    else if (c === 403) m = 'या token ला ही रेपॉझिटरी बदलण्याची परवानगी नाही.';
    else if (c === 404) m = 'रेपॉझिटरी सापडली नाही. युजरनेम आणि नाव तपासा.';
    else if (c === 422) m = 'GitHub ने फाइल स्वीकारली नाही. Branch आणि फाइलचे नाव तपासा.';
    else if (e && e.name === 'TypeError') m = 'इंटरनेट किंवा GitHub शी संपर्क झाला नाही.';
    setStatus(m, 'bad'); toast(m);
  }
  async function doPublish() {
    if (busy) return; var er = validate(); if (er) { toast(er); return; }
    busy = true; $('e-pub').disabled = true; setStatus('जतन होत आहे…');
    try {
      S.sample = false;
      if (CLAUDE) {
        var a = await CLAUDE.use('artifact'); if (!a) { var ee = new Error('x'); ee.code = 'not_granted'; throw ee; }
        await a.publish(buildDoc(false)); try { sessionStorage.setItem('mn-done', '1'); } catch (x) {}
      } else {
        await hostSong();
        await ghPut(ghCfg().path || 'index.html', b64s(buildDoc(true)), 'निमंत्रण अद्ययावत');
        setStatus('GitHub वर जतन झाले ✓', 'ok'); toast('जतन झाले. बदल दिसायला १-२ मिनिटे लागतात.');
      }
      dirty = false; ls.del('mn-draft'); renderNotes();
    } catch (e) { showErr(e); }
    busy = false; var pb = $('e-pub'); if (pb) pb.disabled = false;
  }
  async function exportFile() {
    var er = validate(); if (er) { toast(er); return; }
    var d = CLAUDE ? await CLAUDE.use('downloads') : null;
    if (!d) { toast('इथे डाउनलोड शक्य नाही'); return; }
    try { await d.save({ filename: 'index.html', data: buildDoc(true) }); toast('फाइल जतन झाली'); }
    catch (e) { if (!e || e.code !== 'declined') toast('डाउनलोड झाले नाही'); }
  }
})();
